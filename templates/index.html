<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palette OAuth2 Provider</title>
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg: #f8fafc;
            --surface: #ffffff;
            --text: #0f172a;
            --text-muted: #64748b;
            --success: #22c55e;
            --border: #e2e8f0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            margin: 0;
            padding: 2rem;
            display: flex;
            justify-content: center;
        }
        main {
            background: var(--surface);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            max-width: 600px;
            width: 100%;
        }
        header {
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }
        h1 {
            margin: 0;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .status-badge {
            background-color: #dcfce7;
            color: var(--success);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
        }
        .endpoint-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .endpoint-item {
            padding: 1rem;
            border: 1px solid var(--border);
            border-radius: 8px;
            margin-bottom: 1rem;
            transition: border-color 0.2s;
        }
        .endpoint-item:hover {
            border-color: var(--primary);
        }
        .method {
            font-weight: bold;
            font-size: 0.75rem;
            padding: 0.125rem 0.375rem;
            border-radius: 4px;
            margin-right: 0.5rem;
        }
        .get { background-color: #e0f2fe; color: #0284c7; }
        .post { background-color: #dcfce7; color: #16a34a; }

        .path {
            font-family: monospace;
            font-weight: 600;
        }
        .description {
            margin: 0.5rem 0 0;
            color: var(--text-muted);
            font-size: 0.9rem;
        }
        footer {
            margin-top: 2rem;
            text-align: center;
            font-size: 0.875rem;
            color: var(--text-muted);
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>
                <span>🎨</span> Palette OAuth2 Provider
            </h1>
            <p>
                <span class="status-badge" role="status">
                    <span aria-hidden="true">●</span> System Operational
                </span>
            </p>
        </header>

        <section aria-labelledby="endpoints-title">
            <h2 id="endpoints-title" style="font-size: 1.1rem; margin-bottom: 1rem;">Available Endpoints</h2>
            <ul class="endpoint-list">
                <li class="endpoint-item">
                    <div>
                        <span class="method get">GET</span>
                        <span class="path">/authorize</span>
                    </div>
                    <p class="description">Initiate OAuth2 authorization flow.</p>
                </li>
                <li class="endpoint-item">
                    <div>
                        <span class="method post">POST</span>
                        <span class="path">/token</span>
                    </div>
                    <p class="description">Exchange authorization code for access token.</p>
                </li>
                <li class="endpoint-item">
                    <div>
                        <span class="method get">GET</span>
                        <span class="path">/userinfo</span>
                    </div>
                    <p class="description">Retrieve authenticated user information.</p>
                </li>
            </ul>
        </section>

        <footer>
            <p>Micro-UX enhancement by Palette</p>
        </footer>
    </main>
</body>
</html>
