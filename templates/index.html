<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="OAuth2 Provider Service - Secure authentication and authorization">
    <title>OAuth2 Provider</title>
    <style>
        :root {
            --primary-color: #2563eb;
            --primary-hover: #1d4ed8;
            --text-color: #1f2937;
            --bg-color: #f3f4f6;
            --card-bg: #ffffff;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--bg-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--card-bg);
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            padding: 1rem 0;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--primary-color);
            text-decoration: none;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
        }

        .card {
            background: var(--card-bg);
            border-radius: 0.5rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 2.5rem;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 {
            margin-top: 0;
            color: var(--text-color);
        }

        p {
            color: #4b5563;
            margin-bottom: 2rem;
        }

        .cta-button {
            display: inline-block;
            background-color: var(--primary-color);
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.375rem;
            text-decoration: none;
            font-weight: 500;
            transition: background-color 0.2s;
        }

        .cta-button:hover, .cta-button:focus {
            background-color: var(--primary-hover);
            outline: 2px solid var(--primary-color);
            outline-offset: 2px;
        }

        .features {
            margin-top: 2rem;
            text-align: left;
            border-top: 1px solid #e5e7eb;
            padding-top: 2rem;
        }

        .features h2 {
            font-size: 1.125rem;
            margin-bottom: 1rem;
        }

        .features ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .features li {
            position: relative;
            padding-left: 1.5rem;
            margin-bottom: 0.5rem;
            color: #4b5563;
        }

        .features li::before {
            content: "✓";
            position: absolute;
            left: 0;
            color: var(--primary-color);
            font-weight: bold;
        }

        footer {
            text-align: center;
            padding: 2rem 0;
            color: #6b7280;
            font-size: 0.875rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="container">
            <a href="/" class="logo" aria-label="OAuth2 Provider Home">OAuth2 Provider</a>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="card">
                <h1>Secure Authentication</h1>
                <p>A lightweight, spec-compliant OAuth2 provider service for your applications.</p>

                <div class="features">
                    <h2>Features</h2>
                    <ul>
                        <li>Authorization Code Flow</li>
                        <li>JWT Token Management</li>
                        <li>Secure User Registration</li>
                        <li>Client Management</li>
                    </ul>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2024 OAuth2 Provider. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
