<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OAuth2 Provider - API Gateway</title>
    <style>
        :root {
            --primary: #2563eb;
            --surface: #ffffff;
            --background: #f8fafc;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            line-height: 1.5;
            color: var(--text-main);
            background: var(--background);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: var(--surface);
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
            max-width: 600px;
            width: 90%;
            text-align: center;
        }
        h1 {
            color: var(--primary);
            margin-bottom: 0.5rem;
        }
        p {
            color: var(--text-muted);
            margin-bottom: 2rem;
        }
        .endpoints {
            text-align: left;
            background: #f1f5f9;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 2rem;
        }
        code {
            font-family: monospace;
            background: #e2e8f0;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-size: 0.875rem;
        }
        .cta-button {
            display: inline-block;
            background: var(--primary);
            color: white;
            text-decoration: none;
            padding: 0.75rem 1.5rem;
            border-radius: 6px;
            font-weight: 500;
            transition: background-color 0.2s;
        }
        .cta-button:hover {
            background-color: #1d4ed8;
        }
        .sr-only {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border-width: 0;
        }
    </style>
</head>
<body>
    <main class="container">
        <h1>OAuth2 Provider</h1>
        <p>A secure and lightweight OAuth2 provider service built with Go.</p>

        <div class="endpoints">
            <h3>Available Endpoints</h3>
            <ul>
                <li><strong>Authorization:</strong> <code>GET /authorize</code></li>
                <li><strong>Token:</strong> <code>POST /token</code></li>
                <li><strong>User Info:</strong> <code>GET /userinfo</code></li>
            </ul>
        </div>

        <a href="https://github.com/go-oauth2/oauth2" class="cta-button" target="_blank" rel="noopener noreferrer">
            View Documentation <span class="sr-only">(opens in new tab)</span>
        </a>
    </main>
</body>
</html>
